# Trivy vulnerability suppressions (structured). The workspace is scanned by
# @fmmenchi/nx-trivy; this file lives at the scan root so Trivy auto-detects it (both the
# local and the docker runner, where the workspace mounts at /workspace).
#
# POLICY — prefer FIXING over ignoring:
#   1. Bump the dependency. For a TRANSITIVE dep, add an `overrides` entry in
#      pnpm-workspace.yaml (scope it to the vulnerable version line to avoid breaking other
#      consumers), then re-scan.
#   2. Add an entry below ONLY when there is no fix, or the risk is formally accepted —
#      always with a `statement` (why) AND `expired_at` (so it is re-reviewed), e.g.:
#
#        - id: CVE-2026-16221
#          statement: "Vulnerable code path not reached in our usage."
#          expired_at: 2026-12-31
#
vulnerabilities:
  - id: CVE-2026-14257
    # brace-expansion DoS (unbounded expansion). Fixed only in 5.0.8 — no patch exists for the
    # 1.x/2.x lines, and forcing them to 5.x breaks the CJS `require('brace-expansion')()` call
    # (5.x is ESM-only). The 1.1.16 instances are transitive, reached only by build-time tooling
    # (minimatch/glob) on our own trusted patterns — never runtime input. The fixable 5.x line is
    # bumped to >=5.0.9 in pnpm-workspace.yaml; this suppresses only the unfixable older lines.
    statement: 'No patch for brace-expansion 1.x/2.x; build-time-only, trusted input; 5.x is fixed via override.'
    expired_at: 2026-12-31

  # image-size 2.0.2 — DoS via a crafted image (71329) and a crafted ICNS (71330). Trivy
  # reports both as `affected`: there is no fixed version upstream at any version, so an
  # override has nothing to point at.
  #
  # WHAT REACHES IT. One resolved line, pulled only by `@docusaurus/mdx-loader`, which reads
  # image dimensions while BUILDING the internal docs site. The images it measures are the ones
  # committed to this repository; nothing user-supplied, nothing at runtime, and `@fmmenchi/docs`
  # is `scope:app` and never published. A denial of service against a build that only ever reads
  # our own files is a build we broke ourselves.
  #
  # WHAT RETIRES THIS: an upstream image-size release that fixes either CVE, or Docusaurus
  # moving off it. Re-checked when the date below expires, whichever comes first.
  - id: CVE-2025-71329
    statement: 'No upstream fix for image-size at any version; build-time only, and the only images it reads are this repository’s own.'
    expired_at: 2026-12-31
  - id: CVE-2025-71330
    statement: 'No upstream fix for image-size at any version; build-time only, and the only images it reads are this repository’s own.'
    expired_at: 2026-12-31

  # ── FIX OUTSIDE THE DEPENDENT'S RANGE ─────────────────────────────────────────────────────
  # tinypool 1.1.1 — two prototype-pollution-to-RCE bugs in the worker options. Fixed only in
  # 2.1.1/2.1.2; the 1.x line has no patch, and its one dependent, @docusaurus/core (3.10.2,
  # still `latest`), declares `^1.0.2`. An override would force a major on Docusaurus — the
  # "outside the range" case of AGENTS.md — and it cannot be PROVEN here, because nothing in
  # this workspace runs that code: Docusaurus constructs its Tinypool only when
  # `future.faster.ssgWorkerThreads` is on, and docusaurus.config.ts sets no `future` flags,
  # so the docs build renders on the current thread and never imports tinypool.
  #
  # WHAT RETIRES THIS: a Docusaurus release on tinypool >=2.1.2 (or a 1.x patch). Pinned by
  # purl so a new version is scanned on its own. Turning on `future.faster` / `future.v4`
  # makes the pool reachable — re-read these two entries before doing it.
  - id: CVE-2026-104848
    purls: ['pkg:npm/tinypool@1.1.1']
    statement: 'Fix only in tinypool 2.x, outside Docusaurus’ ^1.0.2. Unreached: the SSG thread pool is off (no future.faster flag), the docs build never imports tinypool.'
    expired_at: 2026-12-31
  - id: CVE-2026-104849
    purls: ['pkg:npm/tinypool@1.1.1']
    statement: 'Fix only in tinypool 2.x, outside Docusaurus’ ^1.0.2. Unreached: the SSG thread pool is off (no future.faster flag), the docs build never imports tinypool.'
    expired_at: 2026-12-31

  # ── NO FIX UPSTREAM ───────────────────────────────────────────────────────────────────────
  # Trivy reports both as `affected`: no fixed version exists at any version, so there is
  # nothing for an override to point at. Pinned by `purls` like the block above, so a new
  # release is scanned on its own merits. WHAT RETIRES THEM: an upstream release with the fix.
  #
  # braces 3.0.3 — pulled by chokidar and micromatch, i.e. file watching and glob matching in
  # the build tooling, over patterns written in this repository's own configuration.
  - id: CVE-2026-93687
    purls: ['pkg:npm/braces@3.0.3']
    statement: 'No upstream fix. Stack overflow on deeply nested patterns; build-time globbing over this repository’s own patterns.'
    expired_at: 2026-12-31
  # http-cache-semantics 4.2.0 — pulled by `got` (via cacheable-request), which fetches from
  # the npm registry for Docusaurus' update check and downloads the swc binary for @swc/cli.
  # A cache-directive information disclosure needs a shared cache in front of private
  # responses; these are anonymous GETs of public files from a build.
  - id: CVE-2026-93748
    purls: ['pkg:npm/http-cache-semantics@4.2.0']
    statement: 'No upstream fix. max-stale information disclosure; only anonymous GETs of public registry/release files, at build time.'
    expired_at: 2026-12-31
