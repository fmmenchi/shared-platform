name: Attach SBOMs to releases
description: >-
  For each {project}@{version} tag in `tags-file`, generate a CycloneDX SBOM via @fmmenchi/nx-trivy
  (docker runner) and upload it to that GitHub Release as sbom.cdx.json. Non-fatal per tag.
  Requires a prior `setup` (nx + the plugin installed).

inputs:
  tags-file:
    description: Path to a file with one {project}@{version} tag per line.
    required: true
  github-token:
    description: A token with contents:write, to upload the release asset.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          pkg=${tag%@*}
          # The release names the package; the asset just needs to say what it is.
          out="sbom.cdx.json"
          # An SBOM is opt-in per project (`nx g @fmmenchi/nx-trivy:sbom <project>`), so a released
          # package may legitimately have no `sbom` target. Say so as a warning — the release is
          # already out, and failing the job here would help nobody.
          if ! pnpm nx show project "$pkg" --json | grep -q '"sbom"'; then
            echo "::warning::$pkg has no 'sbom' target — run 'pnpm nx g @fmmenchi/nx-trivy:sbom $pkg' to attach one to its releases."
            continue
          fi
          if pnpm nx run "$pkg:sbom" --configuration=docker --output="$out"; then
            gh release upload "$tag" "$out" --clobber || echo "::warning::SBOM upload failed for $tag."
          else
            echo "::warning::SBOM generation failed for $pkg — skipping."
          fi
        done < "${{ inputs.tags-file }}"
