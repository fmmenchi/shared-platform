name: Attach SBOMs to releases
description: >-
  For each tag in the release record, generate a CycloneDX SBOM via @fmmenchi/nx-trivy
  (docker runner) and upload it to that GitHub Release as sbom.cdx.json. Non-fatal per
  release. Requires a prior `setup` (nx + the plugin installed).

inputs:
  result-file:
    description: >-
      The release record from the `release` brick — { releases: [{ project, version, tag }] }.
      Preferred: it carries the project, so nothing here has to cut one out of a tag.
    required: false
    default: ''
  tags-file:
    description: >-
      Deprecated. One {project}@{version} tag per line, split back into project and version
      by string surgery — which only works for repos that tag that way. Use `result-file`.
    required: false
    default: ''
  project:
    description: >-
      The project whose SBOM describes a tag that SEVERAL projects share — a fixed release
      group, where the deliverable is one app and the rest are its libraries. Unused for a
      tag with a single project. Without it a shared tag gets no SBOM, and a warning.
    required: false
    default: ''
  github-token:
    description: A token with contents:write, to upload the release asset.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RESULT_FILE: ${{ inputs.result-file }}
        TAGS_FILE: ${{ inputs.tags-file }}
        SBOM_PROJECT: ${{ inputs.project }}
      run: |
        if [ -z "$RESULT_FILE" ] && [ -z "$TAGS_FILE" ]; then
          echo "::error::attach-sbom needs result-file (preferred) or tags-file."
          exit 1
        fi

        # One "<project> <tag>" line per release. From the record the project is GIVEN; from
        # the deprecated tags file it has to be cut out of the tag, which is precisely the
        # parsing the record exists to abolish — and which is wrong for any repo whose tags
        # are not {project}@{version}.
        #
        # One line per TAG, not per record. A fixed release group lists every project it
        # holds under the one tag it cut, and this loop used to upload sbom.cdx.json to that
        # tag once per project with --clobber: N docker runs, and the Release kept whichever
        # came last. One Release has one bill of materials, so a shared tag takes it from the
        # `project` input — and gets none, loudly, when nobody said which project that is.
        if [ -n "$RESULT_FILE" ]; then
          releases=$(node -e "
            const { releases } = JSON.parse(require('fs').readFileSync(process.env.RESULT_FILE, 'utf8'));
            const byTag = new Map();
            for (const r of releases) byTag.set(r.tag, [...(byTag.get(r.tag) ?? []), r]);
            for (const [tag, group] of byTag) {
              const pick = group.length === 1 ? group[0] : group.find((r) => r.project === process.env.SBOM_PROJECT);
              if (pick) console.log([pick.project, pick.version, pick.tag].join(' '));
              else console.error('::warning::' + tag + ' covers ' + group.length + ' projects and the project input names none of them — no SBOM attached.');
            }
          ")
        else
          releases=$(while IFS= read -r tag; do [ -z "$tag" ] || echo "${tag%@*} ${tag##*@} $tag"; done < "$TAGS_FILE")
        fi
        [ -z "$releases" ] && { echo "No SBOM to attach."; exit 0; }

        while read -r pkg version tag; do
          [ -z "$pkg" ] && continue
          # The release names the package; the asset just needs to say what it is.
          out="sbom.cdx.json"
          # No "does this project have an sbom target?" question any more: every project with
          # a package.json infers one (ADR-0031). What decides who gets a bill of materials is
          # this loop — the release record — and nothing else.
          # `--packageVersion`, from the record: this job has its own fresh checkout, where
          # package.json still holds the PRE-release version (nx does not commit its bumps),
          # so without it the bill of materials names a version nobody shipped. It cannot be
          # called `--version` — nx reserves that flag and would swallow it.
          if pnpm nx run "$pkg:sbom" --configuration=docker --output="$out" --packageVersion="$version"; then
            gh release upload "$tag" "$out" --clobber || echo "::warning::SBOM upload failed for $tag."
          else
            echo "::warning::SBOM generation failed for $pkg — skipping."
          fi
        done <<< "$releases"
