name: Trivy scan
description: >-
  Run the @fmmenchi/nx-trivy vulnerability (and optionally secret) scan via the docker runner.
  Requires a prior `setup` (nx + the plugin installed).

inputs:
  secret-scan:
    description: Also run the secret scan after the vulnerability scan.
    required: false
    default: 'true'
  cache-db:
    description: >-
      Cache Trivy's vulnerability DB between runs, keyed per day. Worth it when you scan
      OFTEN (on every dependency change): the DB is ~100 MiB to download and ~70 MiB to
      store. Turn it OFF when you scan on a WEEKLY schedule — the DB expires in about 21
      hours, so a restored copy is always stale, Trivy discards it and downloads a fresh
      one anyway, and the run pays to upload another copy nobody will use.
    required: false
    default: 'true'

  report:
    description: >-
      Write a JSON report to this path (workspace-relative), for attaching to an alert. It costs
      a SECOND scan: Trivy writes either stdout or a file, and a run that only wrote the file
      would leave no table in the log. So the report pass runs first with findings NOT fatal,
      then the gating pass runs normally — the report therefore exists even when the scan is red,
      which is the only case anyone wants it. The DB is already cached by then.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Never name a project here. The scan targets are INFERRED onto the workspace root project,
    # whose name differs in every repo, so the action asks the graph who owns them. Empty means
    # the plugin is not registered in nx.json — which is a scan that would silently not happen,
    # so it fails the job instead. (`nx run-many` would exit 0 on no matches: measured.)
    - name: Resolve the scan host project
      id: host
      shell: bash
      run: |
        # `--json` is not alone on stdout. With the daemon off — which is CI — every
        # plugin loads in-process, and whatever they log shares this stream: React
        # Router's five future-flag warnings, for one. Nx also drains stdout as it
        # exits, so noise can land AFTER the result as well as before it, which is
        # why neither `head` nor `tail` is the answer. The result is one line and it
        # is a JSON array, so take the last line that parses as one; parsing the
        # whole stream first keeps the clean case working if nx ever pretty-prints.
        # Nothing parseable means nx failed, not that the target is missing — say so
        # here rather than let the caller report a target nobody could have added.
        first() {
          pnpm nx show projects --with-target "$1" --json \
            | node -e '
              const asArray = (s) => {
                try {
                  const value = JSON.parse(s);
                  return Array.isArray(value) ? value : null;
                } catch {
                  return null;
                }
              };
              const text = require("fs").readFileSync(0, "utf8");
              let projects = asArray(text);
              if (!projects) {
                for (const line of text.split("\n")) {
                  projects = asArray(line.trim()) ?? projects;
                }
              }
              if (!projects) {
                console.error("`nx show projects --json` printed no JSON array. Its output was:\n" + text);
                process.exit(1);
              }
              process.stdout.write(projects[0] ?? "");
            '
        }
        vuln="$(first scan-docker)"
        if [ -z "$vuln" ]; then
          echo "::error::No project exposes a 'scan-docker' target. Run 'pnpm nx add @fmmenchi/nx-trivy' (or 'pnpm nx g @fmmenchi/nx-trivy:init' if it is already installed) so the plugin is registered in nx.json and its scan targets are inferred."
          exit 1
        fi
        {
          echo "vuln=$vuln"
          echo "secret=$(first scan-secrets-docker)"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve the day (DB cache key)
      id: day
      if: ${{ inputs.cache-db == 'true' }}
      shell: bash
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Cache the Trivy vulnerability DB
      if: ${{ inputs.cache-db == 'true' }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: trivy-db-${{ steps.day.outputs.date }}
        restore-keys: trivy-db-

    # Only the vulnerability scan downloads the DB (secret scan uses built-in rules).
    # Without `cache-db` there is no host dir to bind-mount: the docker runner then caches
    # in its own named volume, which is the zero-config default.
    - name: Vulnerability scan
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
      run: |
        cache_arg=()
        if [ "${{ inputs.cache-db }}" = "true" ]; then
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          cache_arg=(--cacheDir="$RUNNER_TEMP/trivy-cache")
        fi

        if [ -n "$REPORT" ]; then
          pnpm nx run "${{ steps.host.outputs.vuln }}:scan-docker" "${cache_arg[@]}" \
            --format=json --output="$REPORT" --failOnFindings=false
          # Checked, and this is the guard that matters: nx silently swallows some flags
          # (`--version` and `--runner` are documented scars in this repo), and a swallowed
          # `--output` would leave the alert with nothing attached and no explanation.
          if [ ! -s "$REPORT" ]; then
            echo "::error::the scan wrote no report at '$REPORT'. Check that nx forwarded --output to the executor."
            exit 1
          fi
        fi

        pnpm nx run "${{ steps.host.outputs.vuln }}:scan-docker" "${cache_arg[@]}"

    # The docker runner writes the DB as root; hand it back so the post-job cache save can archive it.
    - name: Reclaim the cache dir
      if: ${{ inputs.cache-db == 'true' }}
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy-cache" || true

    - name: Secret scan
      if: ${{ inputs.secret-scan == 'true' }}
      shell: bash
      run: |
        host='${{ steps.host.outputs.secret }}'
        if [ -z "$host" ]; then
          echo "::error::secret-scan was requested but no project exposes a 'scan-secrets-docker' target. Run 'pnpm nx g @fmmenchi/nx-trivy:init', or pass secret-scan: false."
          exit 1
        fi
        pnpm nx run "$host:scan-secrets-docker"
