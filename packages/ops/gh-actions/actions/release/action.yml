name: Release
description: >-
  Run `nx release` through @fmmenchi/ci and emit a record of what it released
  ({ project, version, tag } per release). The record is what the SBOM and announce steps
  read. Requires a prior `setup`, and @fmmenchi/ci installed.

inputs:
  dry-run:
    description: Rehearse without releasing. The record is stamped, and no consumable tag list is written.
    required: false
    default: 'false'
  github-token:
    description: Token used for tags, GitHub Releases and publishing.
    required: true

outputs:
  result-file:
    description: >-
      Path to the release record: dryRun plus one entry per release (project, version, tag).
    value: ${{ steps.run.outputs.result-file }}
  released:
    description: How many projects were released (0 when nothing was).
    value: ${{ steps.run.outputs.released }}
  tags-file:
    description: Transitional — the released package tags, one per line.
    value: ${{ steps.run.outputs.tags-file }}

runs:
  using: composite
  steps:
    # RESOLVED, then run as a script. Two traps, both met head-on:
    #   - not the bin (`pnpm exec fmmenchi-release`): pnpm links bins at INSTALL time and
    #     silently skips one whose target does not exist yet, which is always the case in a
    #     repo that builds @fmmenchi/ci from source after installing. This brick died on its
    #     first real run with `Command "fmmenchi-release" not found`.
    #   - not `node -e "import(…)"` either: that leaves process.argv[1] undefined, and nx's
    #     task runner reads it to name the run — publishing crashed with
    #     `ERR_INVALID_ARG_TYPE: The "path" argument must be of type string`.
    # `require.resolve` honours the package's exports map, so the path is right in a
    # consumer and here, and node gets a real script to run.
    - name: Release
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
        RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        RELEASE_RESULT_FILE: ${{ runner.temp }}/release-result.json
        NEW_TAGS_FILE: ${{ runner.temp }}/new_tags.txt
      run: |
        node "$(node -p "require.resolve('@fmmenchi/ci/release')")"
        released=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RELEASE_RESULT_FILE,'utf8')).releases.length")
        {
          echo "result-file=$RELEASE_RESULT_FILE"
          echo "tags-file=$NEW_TAGS_FILE"
          echo "released=$released"
        } >> "$GITHUB_OUTPUT"
        echo "Released $released project(s)."
