name: Release
description: >-
  Run `nx release` through @fmmenchi/ci and emit a record of what it released
  ({ project, version, tag } per release). The record is what the SBOM and announce steps
  read. Requires a prior `setup`, and @fmmenchi/ci installed.

inputs:
  dry-run:
    description: Rehearse without releasing. The record is stamped, and no consumable tag list is written.
    required: false
    default: 'false'
  github-token:
    description: Token used for tags, GitHub Releases and publishing.
    required: true

outputs:
  result-file:
    description: >-
      Path to the release record: dryRun plus one entry per release (project, version, tag).
    value: ${{ steps.run.outputs.result-file }}
  released:
    description: How many projects were released (0 when nothing was).
    value: ${{ steps.run.outputs.released }}
  version:
    description: >-
      The released version, when exactly one project was released — the single-project case,
      where a caller would otherwise re-derive it with `git describe`. Empty for zero or many:
      a monorepo has no single version, and must read the record.
    value: ${{ steps.run.outputs.version }}
  tag:
    description: The released tag, on the same terms as `version`.
    value: ${{ steps.run.outputs.tag }}
  tags-file:
    description: Transitional — the released package tags, one per line.
    value: ${{ steps.run.outputs.tags-file }}

runs:
  using: composite
  steps:
    # RESOLVED, then run as a script. Two traps, both met head-on:
    #   - not the bin (`pnpm exec fmmenchi-release`): pnpm links bins at INSTALL time and
    #     silently skips one whose target does not exist yet, which is always the case in a
    #     repo that builds @fmmenchi/ci from source after installing. This brick died on its
    #     first real run with `Command "fmmenchi-release" not found`.
    #   - not `node -e "import(…)"` either: that leaves process.argv[1] undefined, and nx's
    #     task runner reads it to name the run — publishing crashed with
    #     `ERR_INVALID_ARG_TYPE: The "path" argument must be of type string`.
    # `require.resolve` honours the package's exports map, so the path is right in a
    # consumer and here, and node gets a real script to run.
    - name: Release
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
        RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        RELEASE_RESULT_FILE: ${{ runner.temp }}/release-result.json
        NEW_TAGS_FILE: ${{ runner.temp }}/new_tags.txt
      run: |
        entry=$(node -p "require.resolve('@fmmenchi/ci/release')") || entry=''
        # Checked, because `node ""` exits 0 doing nothing: an unresolved entrypoint would
        # otherwise be a release step that succeeds without releasing. Measured.
        if [ -z "$entry" ]; then
          echo "::error::cannot resolve @fmmenchi/ci/release — is @fmmenchi/ci installed (and built, if it is a source project here)?"
          exit 1
        fi
        node "$entry"
        # `version` and `tag` are the outputs that stop a caller re-deriving what this step
        # already knows. Without them a deploy job reaches for `git describe`, which needs a
        # full-history checkout, a tag glob, and answers with the PREVIOUS tag on a push that
        # released nothing — a real bug, found in a consumer.
        #
        # Single release only: with many, there is no such thing as "the" version, and the
        # honest answer is empty plus a record to read.
        outputs=$(node -p "
          const r = JSON.parse(require('fs').readFileSync(process.env.RELEASE_RESULT_FILE, 'utf8')).releases;
          const only = r.length === 1 ? r[0] : {};
          ['released=' + r.length, 'version=' + (only.version ?? ''), 'tag=' + (only.tag ?? '')].join('\n');
        ")
        {
          echo "result-file=$RELEASE_RESULT_FILE"
          echo "tags-file=$NEW_TAGS_FILE"
          echo "$outputs"
        } >> "$GITHUB_OUTPUT"
        # Repeated in the log because $GITHUB_OUTPUT is invisible from here, and this line is
        # what a human reads when asking why the job below skipped. Derived from the same
        # string that was written, not recomputed: a log that can disagree with the gate is
        # worse than no log.
        echo "Released $(echo "$outputs" | sed -n 's/^released=//p') project(s)."
