name: Announce releases to Slack
description: >-
  Announce each newly-released package (one {project}@{version} tag per line in tags-file)
  to Slack via @fmmenchi/nx-notify, using the notes nx wrote into each GitHub Release as the
  changelog. Skips green when the Slack secrets are absent. Requires a prior `setup`
  (nx + the plugin installed).

inputs:
  tags-file:
    description: Path to a file with one {project}@{version} tag per line.
    required: true
  bot-token:
    description: Slack bot token (SLACK_BOT_TOKEN). Absent → each announce skips green.
    required: false
    default: ''
  channel-id:
    description: Slack channel id (SLACK_CHANNEL_ID).
    required: false
    default: ''
  github-token:
    description: A token to read each Release's notes and URL.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.bot-token }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        failed=0
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          pkg=${tag%@*}       # {projectName}@{version} → strip the trailing @version
          version=${tag##*@}
          body=$(gh release view "$tag" --json body --jq .body 2>/dev/null || true)
          url=$(gh release view "$tag" --json url --jq .url 2>/dev/null || true)
          # `$pkg:announce-release` is the target @fmmenchi/nx-notify infers onto each
          # RELEASABLE project — generic to any nx workspace, no plugin project required.
          # Every tag in this file therefore has the target, private packages included;
          # a missing one means the plugin isn't registered, and failing loudly is right.
          RELEASE_VERSION="$version" RELEASE_URL="$url" RELEASE_BODY="$body" \
            pnpm nx run "$pkg:announce-release" || failed=1
        done < "${{ inputs.tags-file }}"
        exit $failed
