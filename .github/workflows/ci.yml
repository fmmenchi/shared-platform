name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  # One canonical "what kind of run is this?" — downstream jobs consume these
  # outputs instead of each re-deriving github.event_name/github.ref conditions
  # (dogfoods the compute-context brick).
  context:
    runs-on: ubuntu-latest
    outputs:
      event: ${{ steps.ctx.outputs.event }}
      is-release: ${{ steps.ctx.outputs.is-release }}
    steps:
      - uses: actions/checkout@v7
      - id: ctx
        uses: ./packages/ops/gh-actions/actions/compute-context

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ops/gh-actions/actions/setup

      # Browser-mode component tests (native <dialog>, real a11y) need Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm nx sync:check

      - run: pnpm nx format:check --all

      # SPLIT FROM THE SUITE BELOW, and not for tidiness. Run in one `run-many`
      # with `test`, the browser suite died twice on the same commit without
      # producing a vitest summary at all — no failing test named, no assertion
      # reported, because nx interleaves sixteen projects' output and the
      # `Failed tasks` line landed in the middle of another project's stderr.
      # Measured locally with the same shape: green every time when the two are
      # run separately, red at random when together, with a DIFFERENT test
      # falling each run and never one that the commit had touched.
      #
      # So this buys two things — the contention goes, and a failure that does
      # happen is legible instead of anonymous.
      - run: pnpm nx run-many -t typecheck build lint lint-css build-storybook

      # The browser-mode suite, alone. Second because a type error makes every
      # test below it meaningless, and this is the slower half.
      - run: pnpm nx run-many -t test

  # Preview on PRs: what the release would cut if this PR merged. `nx release` versions
  # only the projects with releasing conventional commits, so a plain dry-run is already
  # accurate — no affected pre-filter to mirror. Never versions/tags/publishes.
  release-preview:
    needs: context
    if: needs.context.outputs.event == 'pull-request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ops/gh-actions/actions/setup

      - name: nx release --dry-run (preview — never publishes)
        run: pnpm nx release --dry-run --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Trunk-based release: every green push to main versions each package from its
  # conventional commits, tags {projectName}@{version}, creates the per-project GitHub
  # Release, publishes to GitHub Packages, and announces each newly cut package on Slack
  # (inline — see the Release/Announce steps). Auth is the built-in GITHUB_TOKEN
  # (contents:write for tags/releases, packages:write to publish) — no PAT.
  release:
    needs: [main, context]
    if: needs.context.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    # Serialize releases: two quick merges must not run `nx release` (tag + push)
    # concurrently and race on the push.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ops/gh-actions/actions/setup
        with:
          registry-url: 'https://npm.pkg.github.com'

      # The release step runs the built @fmmenchi/ci affected-releasable script; the
      # announce step dogfoods the @fmmenchi/nx-notify plugin (built on demand via its
      # target's dependsOn).
      - run: pnpm nx build @fmmenchi/ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Run `nx release` (it versions only the projects with releasing conventional commits —
      # a root-file-only change releases nothing) and record the new package tags for the
      # SBOM/announce steps. The tag diff + package-vs-toolkit split lives in @fmmenchi/ci
      # (src/release.ts), unit-tested, not inline here.
      - name: Release
        run: node packages/ops/ci/dist/release.js
        env:
          NEW_TAGS_FILE: ${{ runner.temp }}/new_tags.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nx tags the @fmmenchi/gh-actions toolkit as `gh-actions/v{version}` (its own release
      # group). Consumers pin the moving major `gh-actions/v1`; nx doesn't maintain that alias,
      # so move it here. Idempotent: it always points the major at the latest exact tag, whether
      # or not this run released the toolkit — a no-op when nothing changed.
      - name: Move the gh-actions major alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_PREFIX: gh-actions/v
        run: node packages/ops/ci/dist/move-major-alias.js

      # Attach a per-package CycloneDX SBOM to each release — supply-chain transparency for
      # the deployable projects that consume these packages. The attach-sbom brick generates
      # each (docker runner, from an nx-pruned lockfile) and uploads it as sbom.cdx.json.
      # Non-fatal per tag: the release is already out, so a failed SBOM must not fail the job.
      - name: Attach SBOMs to the releases
        uses: ./packages/ops/gh-actions/actions/attach-sbom
        with:
          tags-file: ${{ runner.temp }}/new_tags.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A GitHub Release created with the built-in GITHUB_TOKEN does NOT trigger other
      # workflows (no recursive runs), so a `release: published` listener never fires from
      # here. Announce inline instead via the announce-releases brick: one Slack message per
      # newly cut package tag, with the notes nx wrote into each Release. Missing secrets skip green.
      - name: Announce releases to Slack
        uses: ./packages/ops/gh-actions/actions/announce-releases
        with:
          tags-file: ${{ runner.temp }}/new_tags.txt
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
