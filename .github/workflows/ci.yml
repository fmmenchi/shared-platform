name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  # One canonical "what kind of run is this?" — downstream jobs consume these
  # outputs instead of each re-deriving github.event_name/github.ref conditions
  # (dogfoods the compute-context brick).
  context:
    runs-on: ubuntu-latest
    outputs:
      event: ${{ steps.ctx.outputs.event }}
      is-release: ${{ steps.ctx.outputs.is-release }}
    steps:
      - uses: actions/checkout@v7
      - id: ctx
        uses: ./packages/ops/gh-actions/actions/compute-context

  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ops/gh-actions/actions/setup

      # Browser-mode component tests (native <dialog>, real a11y) need Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm nx sync:check

      - run: pnpm nx format:check --all

      # SPLIT FROM THE SUITE BELOW, and not for tidiness. Run in one `run-many`
      # with `test`, the browser suite died twice on the same commit without
      # producing a vitest summary at all — no failing test named, no assertion
      # reported, because nx interleaves sixteen projects' output and the
      # `Failed tasks` line landed in the middle of another project's stderr.
      # Measured locally with the same shape: green every time when the two are
      # run separately, red at random when together, with a DIFFERENT test
      # falling each run and never one that the commit had touched.
      #
      # The contention half of that held. The LEGIBILITY half did not, and this
      # comment claimed it did: four failures later the suite still names no
      # test. Keeping the split anyway — it is the right shape and it removed a
      # real source of flakiness — but the instrument for the second half is on
      # the step below, where it should have been.
      #
      # `--outputStyle=stream` for the same reason as the suite below, and this
      # step is the one that had never been asked the question: it is the OTHER
      # `run-many` over sixteen projects, so a lint or type error here would
      # have been swallowed exactly the way the test failures were. Nothing has
      # gone wrong here yet — this is the shape being fixed, not an incident.
      #
      # Deliberately NOT applied to the single-task `nx run` calls in the
      # reusable workflows and the composite actions. Measured: a single task
      # reports its failure in full — the FAIL line, the test name and the
      # summary all arrive. The loss needs many tasks and a large output, which
      # is a shape those bricks do not have, and a flag added on suspicion is a
      # claim nobody can check later.
      - run: pnpm nx run-many -t typecheck build lint lint-css build-storybook
          --outputStyle=stream

      # The browser-mode suite, alone. Second because a type error makes every
      # test below it meaningless, and this is the slower half.
      #
      # INSTRUMENTED, and the instrument has already earned its place. This step
      # failed four times on `main` without ever naming a test: everything it
      # printed was green, vitest never reached its summary, and the output
      # stopped MID-LINE — which reads exactly like a process being killed.
      #
      # IT IS NOT BEING KILLED. `time -v` settled it on the first run: `Exit
      # status: 1`, no signal, and a peak resident set of 1.9 GB against a runner
      # with several times that. So the OOM theory is dead and so is the
      # concurrency theory that followed from it — this is an ordinary failing
      # test whose report is lost to GitHub's step-log TRUNCATION. One number
      # closed two hypotheses that would each have taken a day.
      #
      # `time -v` stays, because that number is the one that tells a kill from a
      # failure and it costs nothing to keep asking. Guarded, because a missing
      # `/usr/bin/time` would turn a diagnostic into an outage. `tee` keeps the
      # whole output for the step below.
      #
      # AND IT IS NOT GITHUB DOING THE TRUNCATING EITHER. With the whole run
      # captured to a file, that file STILL names no failing test: it ends
      # mid-stream, and Nx's own `Failed tasks:` line appears ~hundreds of lines
      # BEFORE the end. Nx buffers each task's output internally and flushes it
      # after its own summary — and the tail of the failing task's buffer never
      # arrives. `--outputStyle=stream` takes that buffer out of the path
      # entirely ("nx by default logs output to an internal output stream,
      # enable this option to stream logs to stdout / stderr"). Lines come back
      # interleaved, which is what the split above was meant to avoid, but
      # `stream` prefixes every line with its project — attributable, and a
      # prefix is a cheaper price than a verdict with no evidence.
      - name: Browser-mode suite (instrumented — see the comment)
        id: suite
        run: |
          # PIPEFAIL, EXPLICITLY, and this line is the whole difference between a
          # gate and a decoration. The default shell for `run:` on Linux is
          # `bash -e` WITHOUT pipefail — only an explicit `shell: bash` adds it —
          # so `suite | tee` reports TEE's status and a failing suite comes out
          # green. Measured on the first run of this very step: the suite exited
          # 1, the job passed, and a red gate would have been converted into a
          # release. A CI that lies green is worse than the failure it hides.
          set -o pipefail
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v pnpm nx run-many -t test --outputStyle=stream 2>&1 | tee /tmp/test.log
          else
            pnpm nx run-many -t test --outputStyle=stream 2>&1 | tee /tmp/test.log
          fi

      # A SMALL step, so the truncation that ate the evidence cannot eat this
      # too: the exit status, the lines that look like failures, and the tail of
      # the run — which is where the failing test's name has been all along. The
      # machine's memory and the kernel ring buffer are kept as the CONTROL: if a
      # future failure really is a kill, they say so at once instead of sending
      # somebody down the road this one did.
      - name: Why the suite failed
        # SCOPED TO THE SUITE, not to the job: `failure()` alone would fire for a
        # lint failure too, and then read a `/tmp/test.log` that was never
        # written.
        if: failure() && steps.suite.conclusion == 'failure'
        run: |
          # NO `set -o pipefail` HERE, and that is deliberate — the opposite call
          # from the step above. A `grep | tail` that matches nothing exits 1,
          # and under pipefail this step would fail for having found no problem,
          # taking the diagnostic down at the exact moment it is needed. Nothing
          # here gates anything; it only prints.
          echo '::group::exit status and peak memory (from `time -v`)'
          grep -aE 'Command terminated|Exit status|Maximum resident|Elapsed' /tmp/test.log || echo 'no time -v output'
          echo '::endgroup::'
          echo '::group::anything that looks like a failure'
          grep -anE 'FAIL|AssertionError|Unhandled|✗|×|Error:|Failed tasks' /tmp/test.log | tail -60 || echo 'nothing matched'
          echo '::endgroup::'
          echo '::group::last 120 lines of the run'
          tail -120 /tmp/test.log
          echo '::endgroup::'
          echo '::group::machine'
          free -m; df -h /
          echo '::endgroup::'
          echo '::group::kernel ring buffer'
          sudo dmesg | tail -60 || echo 'dmesg unavailable'
          echo '::endgroup::'

  # Trunk-based release: every green push to main versions each package from its
  # conventional commits, tags {projectName}@{version}, creates the per-project GitHub
  # Release, publishes to GitHub Packages, and announces each newly cut package on Slack
  # (inline — see the Release/Announce steps). Auth is the built-in GITHUB_TOKEN
  # (contents:write for tags/releases, packages:write to publish) — no PAT.
  release:
    needs: [main, context]
    if: needs.context.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    # Serialize releases: two quick merges must not run `nx release` (tag + push)
    # concurrently and race on the push.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./packages/ops/gh-actions/actions/setup
        with:
          registry-url: 'https://npm.pkg.github.com'

      # The release brick runs @fmmenchi/ci's bin, which is this repo's own source linked
      # into node_modules — so it has to be built first. A consumer installs it built.
      - run: pnpm nx build @fmmenchi/ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Release, and emit a record of what was released ({ project, version, tag } each) for
      # the steps below. Same brick, same `pnpm exec fmmenchi-release`, that a consumer runs —
      # nothing here knows a path into @fmmenchi/ci. nx versions only the projects with
      # releasing conventional commits, so a root-file-only change releases nothing.
      - name: Release
        id: release
        uses: ./packages/ops/gh-actions/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The record crosses the job boundary two ways, because the two consumers need
      # different things: `released` as a job output (a string, cheap, drives the `if:`),
      # and the record itself as an artifact — which is what makes "Re-run failed jobs"
      # able to re-announce a release without re-releasing it.
      - name: Publish the release record
        uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: ${{ steps.release.outputs.result-file }}
          if-no-files-found: error
          retention-days: 30

  # Attaching an SBOM and announcing are SEPARATE OPERATIONS from releasing, so they are
  # separate jobs: each fails, and is re-run, on its own. The release is irreversible; these
  # are not. The price is a checkout + install per job, and it buys exactly that.
  sbom:
    needs: [release]
    if: needs.release.outputs.released != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./packages/ops/gh-actions/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: release-result
          path: ${{ runner.temp }}

      # Supply-chain transparency for whoever consumes these packages: one CycloneDX SBOM
      # per RELEASED project (the record names the project, so nothing parses a tag),
      # generated from an nx-pruned lockfile and uploaded to that Release.
      - name: Attach SBOMs to the releases
        uses: ./packages/ops/gh-actions/actions/attach-sbom
        with:
          result-file: ${{ runner.temp }}/release-result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

  announce:
    needs: [release]
    if: needs.release.outputs.released != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./packages/ops/gh-actions/actions/setup

      # This job has its own fresh runner, and here @fmmenchi/ci is a SOURCE project: its
      # dist does not exist until built. A consumer installs it built, which is why the
      # notify brick found nothing on its first run and — before it was taught to check —
      # reported success anyway.
      - run: pnpm nx build @fmmenchi/ci

      - uses: actions/download-artifact@v4
        with:
          name: release-result
          path: ${{ runner.temp }}

      # A GitHub Release created with the built-in GITHUB_TOKEN does NOT trigger other
      # workflows, so a `release: published` listener would never fire — announce from here.
      # One message per released project, and the step is RED if a message it was asked to
      # send did not arrive. Missing Slack secrets skip green, loudly.
      - name: Announce the releases
        uses: ./packages/ops/gh-actions/actions/notify
        with:
          result-file: ${{ runner.temp }}/release-result.json
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
