name: Security (reusable)

# Turnkey security pipeline for any @fmmenchi consumer (an nx workspace with the plugins
# installed). Call it from your own workflow — one job, one line:
#
#   jobs:
#     security:
#       uses: fmmenchi/shared-platform/.github/workflows/security.reusable.yml@gh-actions/v0.1.2
#       secrets: inherit
#
# The caller owns the triggers (dep-change paths + a weekly schedule is the recommended pair)
# and decides when to alert (e.g. alert-on-failure only on the scheduled run).
on:
  workflow_call:
    inputs:
      secret-scan:
        description: Also run the secret scan.
        type: boolean
        required: false
        default: true
      cache-db:
        description: >-
          Cache Trivy's vulnerability DB between runs. Leave it on when you scan on every
          dependency change; turn it OFF for a weekly-only cadence, where the DB has
          expired by the next run and the cache costs an upload nobody reads.
        type: boolean
        required: false
        default: true
      alert-on-failure:
        description: Post a Slack alert if the scan fails. Let the caller gate this (e.g. only on schedule).
        type: boolean
        required: false
        default: false
      app-name:
        description: Name used in Slack messages (defaults to the repo name).
        type: string
        required: false
        default: ''
    secrets:
      SLACK_BOT_TOKEN:
        required: false
      SLACK_CHANNEL_ID:
        required: false

permissions:
  contents: read

# A consumer's CI install must not run husky git hooks.
env:
  HUSKY: 0

jobs:
  scan:
    name: Vulnerabilities & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.1.2

      - name: Scan
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/trivy-scan@gh-actions/v0.1.2
        with:
          secret-scan: ${{ inputs.secret-scan }}
          cache-db: ${{ inputs.cache-db }}

      # No project to name: the alert carries its own identity in the event, so nothing
      # here has to know which of your projects hosts a notification target.
      - name: Alert Slack on findings
        if: ${{ failure() && inputs.alert-on-failure }}
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/notify@gh-actions/v0.1.2
        with:
          kind: error
          app: ${{ inputs.app-name || github.event.repository.name }}
          message: 'The Trivy audit found CRITICAL/HIGH dependency vulnerabilities.'
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
