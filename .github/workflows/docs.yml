name: Docs

# Deploy the documentation site (apps/docusaurus, serving its co-located docs/) WITH the
# component Storybook under /storybook/ to GitHub Pages, on every push to main that touches
# the site, a package's docs, or the design system. Dogfoods the reusable docs workflow.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/docusaurus/**'
      - 'packages/**/docs/**'
      - 'packages/client/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs.reusable.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/docs.reusable.yml
    with:
      docs-project: '@fmmenchi/docs'
      docs-output: apps/docusaurus/build
      storybook-project: '@fmmenchi/ui'
      storybook-static: packages/client/ui/storybook-static
