name: Security

# A vulnerability scan is not a test. A test goes red because the CODE changed; a scan goes
# red because the WORLD changed — a CVE was published against a dependency nobody touched.
# So it runs on two triggers: when the dependencies change (that is when WE introduce
# something), and every Monday (that is when the world does). This repo consumes its own
# reusable security workflow exactly like an external @fmmenchi consumer would — see ADR-0007.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'packages/plugins/trivy/**'
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'packages/plugins/trivy/**'
  schedule:
    - cron: '0 6 * * 1' # weekly audit — Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Dogfood the turnkey pipeline (the reusable, not just the bricks). The caller owns the
  # triggers above and the gating: alert only on the weekly run (a PR already shows a red check).
  security:
    uses: ./.github/workflows/security.reusable.yml
    with:
      app-name: shared-platform
      announce-project: '@fmmenchi/ci'
      alert-on-failure: ${{ github.event_name == 'schedule' }}
    secrets: inherit
