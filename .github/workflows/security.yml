name: Security

# A vulnerability scan is not a test. A test goes red because the CODE changed; a scan goes
# red because the WORLD changed — a CVE was published against a dependency nobody touched.
# So it runs on two triggers: when the dependencies change (that is when WE introduce
# something), and every Monday (that is when the world does). Running it on every push would
# repeat the same result forty times a week and train us to stop reading it. Dogfoods
# @fmmenchi/nx-trivy; workspace-level by design (single root lockfile) — see ADR-0007.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'packages/plugins/trivy/**'
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'packages/plugins/trivy/**'
  schedule:
    - cron: '0 6 * * 1' # weekly audit — Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Post a test message to Slack instead of scanning'
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  trivy:
    name: Vulnerabilities & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # A notification you cannot test is one you do not have: without this, the Slack path
      # first runs for real on the Monday it matters — the day you learn the bot was never
      # invited to the channel. Dogfoods @fmmenchi/nx-notify like the real alert below.
      - name: Test the Slack wiring
        if: ${{ inputs.test_notification }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          ERROR_MESSAGE: 'Security Slack wiring test — if you can read this, the weekly audit can reach you.'
          ERROR_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm nx run @fmmenchi/nx-notify:announce-error --appName=shared-platform

      # Cache the Trivy vulnerability DB. This job also runs on every dependency change (not
      # only weekly), and those runs cluster — re-downloading ~100 MiB each time is waste. Key
      # it per day: the first run of a day refreshes the DB, the rest reuse it, and Trivy
      # re-validates freshness against its own TTL, so a restored DB is never used past its
      # shelf life. The secret scan below needs no DB (built-in rules); the SBOM doesn't either.
      - name: Resolve the day (DB cache key)
        if: ${{ !inputs.test_notification }}
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache the Trivy vulnerability DB
        if: ${{ !inputs.test_notification }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-

      # Dogfood the plugin: docker runner (aquasec/trivy image — no trivy install on the
      # runner). `cacheDir` bind-mounts the cached DB dir into the container.
      # .trivyignore.yaml at the repo root is auto-detected.
      - name: Vulnerability scan
        if: ${{ !inputs.test_notification }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          pnpm nx run @fmmenchi/nx-trivy:scan-docker --cacheDir="$RUNNER_TEMP/trivy-cache"

      # The docker runner writes the DB as root; hand it back to the runner user so the
      # post-job cache save can archive it. Best-effort — a failure here must not fail the scan.
      - name: Reclaim the cache dir
        if: ${{ !inputs.test_notification }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy-cache" || true

      # Secrets can be committed anywhere in the tree, so this is a workspace scan too. Skips
      # node_modules/dist/build/.nx/.git (see the target's extraArgs) to avoid noise.
      - name: Secret scan
        if: ${{ !inputs.test_notification }}
        run: pnpm nx run @fmmenchi/nx-trivy:scan-secrets-docker

      # Only on the weekly run, and only when it broke: a PR already shows a red check, and a
      # weekly message that arrives regardless is one nobody opens. Missing secrets skip green.
      - name: Alert Slack on findings
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          ERROR_MESSAGE: 'The weekly Trivy audit found CRITICAL/HIGH dependency vulnerabilities. Remediate via a pnpm-workspace.yaml override or suppress in .trivyignore.yaml.'
          ERROR_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm nx run @fmmenchi/nx-notify:announce-error --appName=shared-platform
