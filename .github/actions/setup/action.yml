name: Setup workspace
description: pnpm + Node + a frozen install for an nx workspace. Run this before any brick that shells out to nx.

inputs:
  node-version:
    description: Node version to set up.
    required: false
    default: '24'
  registry-url:
    description: npm registry to configure (set it only for jobs that publish, e.g. GitHub Packages).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
