packages:
  - 'packages/*'
  - 'packages/*/*'
  - 'apps/*'
# Force fixed versions of transitive deps flagged by the Trivy scan (all HIGH). Prefer this
# remediation over a .trivyignore.yaml.
#
# SCOPED PER MAJOR wherever more than one line is resolved, because an override forces its
# version on every dependent regardless of the range they declared and pnpm installs without
# complaining — so a blanket entry is a major bump applied to somebody else's package:
#   - brace-expansion: a blanket override drags 1.x/2.x consumers to 5.x, whose ESM export
#     breaks their `require('brace-expansion')()` call (`expand is not a function`) — measured;
#   - js-yaml: 4.x removed `safeLoad`, so a 3.x consumer forced across would fail at runtime,
#     which is why the two lines are fixed separately on their own patch releases.
# Each of these is a PATCH within its own major, so every dependent's range still admits it —
# and each is BOUNDED ABOVE for the same reason. An open `>=` is not a floor, it is an
# instruction to take the newest thing that exists: measured here, `js-yaml: '>=4.3.1'`
# resolved js-yaml **5.2.3**, and the `fast-uri: '>=3.1.4'` that was already in this file had
# quietly carried a 3.x consumer to 4.1.1 the same way.
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  axios: '>=1.18.0'
  'brace-expansion@1': '>=1.1.20 <2'
  'brace-expansion@2': '>=2.1.6 <3'
  'brace-expansion@5': '>=5.0.9 <6'
  fast-uri: '>=4.1.4 <5'
  'js-yaml@3': '>=3.15.1 <4'
  'js-yaml@4': '>=4.3.2 <5'
  # nanoid 3.3.16 → CVE-2026-67213 (infinite loop). Only the 3.x line is resolved here, pulled
  # by postcss for the docs site's build, and 3.3.17 is a PATCH inside postcss's own `^3.3.x`
  # range — an ordinary bump. Scoped and bounded all the same: upstream's other fix is 5.1.6,
  # so an unscoped entry would one day force a 5.x consumer back down to 3.x.
  'nanoid@3': '>=3.3.17 <4'
  serialize-javascript: '>=7.0.3'
  # The 2026-10 audit. Each is a PATCH inside the range its only dependents declare, so an
  # ordinary bump — scoped to the resolved major and bounded above like the rest of this block:
  #   piscina 4.9.3 (CVE-2026-102992, CRITICAL)            ← @swc/cli `^4.3.1`
  #   @xhmikosr/decompress 11.1.3 (CVE-2026-101894, CRITICAL) ← @xhmikosr/downloader `^11.1.3`
  #   joi 17.13.4 (GHSA-6h2x-m376-mqjq)                    ← Docusaurus `^17.9.2`
  #   svgo 3.3.4 (CVE-2026-84370)                          ← @svgr/plugin-svgo, postcss-svgo `^3.x`
  #   webpack-dev-middleware 7.4.5 (CVE-2026-76844)        ← webpack-dev-server `^7.4.2`
  'piscina@4': '>=4.9.4 <5'
  '@xhmikosr/decompress@11': '>=11.1.4 <12'
  'joi@17': '>=17.13.7 <18'
  'svgo@3': '>=3.3.5 <4'
  'webpack-dev-middleware@7': '>=7.4.6 <8'
allowBuilds:
  nx: true
  '@swc/core': true
  esbuild: true
  unrs-resolver: false
  core-js: false
